# AutoBilling — single origin: static SPA + proxied API on the same hostname.
#
# Same-origin is deliberate. The refresh-token cookie stays first-party, so
# there is no SameSite=None, no COOKIE_DOMAIN, no CORS preflight on every call.
# Placeholders __DOMAIN__ / __WEB_ROOT__ are filled in by bootstrap.sh.
#
# certbot --nginx rewrites this file in place to add the 443 server block and
# the HTTP→HTTPS redirect. Do not hand-edit those additions.

limit_req_zone $binary_remote_addr zone=autobilling_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    client_max_body_size 8m;      # matches express.json({ limit: '4mb' }) + base64 overhead

    access_log /var/log/nginx/autobilling.access.log;
    error_log  /var/log/nginx/autobilling.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 75s;           # < server.keepAliveTimeout (65s) + margin
        proxy_buffering off;
    }

    # Brute-force damper in front of express-rate-limit. Two independent layers:
    # nginx sheds the flood before Node ever allocates a request context.
    location /api/v1/auth/login {
        limit_req zone=autobilling_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Invoice PDFs. Auth-gated inside Express — never serve this from disk here.
    location /storage/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # ---- SPA ---------------------------------------------------------------
    # Vite emits content-hashed asset filenames, so they are immutable forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers pinned to
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
